<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FutureX-lab TrustGuard - Checker</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans">

  <!-- NAVBAR -->
  <nav class="bg-white shadow p-4">
    <h1 class="text-xl font-bold text-blue-600">FutureX TrustGuard</h1>
  </nav>

  <!-- MAIN CONTENT -->
  <div class="max-w-3xl mx-auto mt-10 p-6">
    
    <h2 class="text-3xl font-bold text-center mb-2">Check if Info is Trustworthy</h2>
    <p class="text-center text-gray-500 mb-8">Paste a link, text, or upload an image</p>

    <!-- INPUT SECTION -->
    <div class="bg-white p-6 rounded-xl shadow">
      <textarea id="userInput" class="w-full p-3 border rounded-lg h-32" 
        placeholder="Paste news link, text, or website URL here..."></textarea>
      
      <button onclick="analyze()" 
        class="mt-4 w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700">
        Analyze Now
      </button>
    </div>

    <!-- RESULT SECTION - HIDDEN AT FIRST -->
    <div id="resultCard" class="mt-8 bg-white p-6 rounded-xl shadow hidden">
      <h3 class="text-2xl font-bold mb-4">Analysis Result</h3>
      
      <!-- SCORE -->
      <div class="flex items-center gap-4 mb-4">
        <div class="text-5xl font-bold text-red-500">25%</div>
        <div class="bg-red-100 text-red-700 px-3 py-1 rounded-full font-semibold">High Risk</div>
      </div>

      <!-- EXPLANATION -->
      <div class="mb-4">
        <h4 class="font-bold">Why?</h4>
        <p class="text-gray-600">This claim was debunked by WHO in 2020. Source is not credible.</p>
      </div>

      <!-- SOURCES -->
      <div>
        <h4 class="font-bold">Trusted Sources:</h4>
        <ul class="list-disc list-inside text-blue-600">
          <li><a href="#">who.int</a></li>
          <li><a href="#">factcheck.org</a></li>
        </ul>
      </div>
    </div>

  </div>

  <script>
    function analyze() {
      // This just shows the dummy result. No real AI yet.
      document.getElementById('resultCard').classList.remove('hidden');
      // Scroll to result
      document.getElementById('resultCard').scrollIntoView({behavior: "smooth"});
    }
  </script>

</body>
</html>
